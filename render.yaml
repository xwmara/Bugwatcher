# Render Blueprint: describes the backend web service, so Render can create it from this file.
# Secrets (DATABASE_URL, DEMO_PASSWORD, CLIENT_URL) are entered in the Render dashboard, never here.
services:
  - type: web
    name: bugwatcher-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    # Migrations and demo data run on every start; both skip what already exists
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Number of proxies in front of the app, measured with DEBUG_IP=true (see backend/app.js):
      # Vercel rewrite -> Cloudflare -> Render load balancer -> app, so X-Forwarded-For is
      # "visitor, vercel, cloudflare, render" and the visitor is 4 hops back.
      # Known limit: requests sent straight to the onrender.com URL could fake one extra hop
      # and avoid the login rate limit; the public site always goes through Vercel.
      - key: TRUST_PROXY
        value: "4"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
